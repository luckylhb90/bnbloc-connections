{{define "layout"}}<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{.Title}}</title>
{{if .Refresh}}<meta name="live" content="{{.State}}">{{end}}
<style>
:root{
  --bg:#f7f7f8;--surface:#fff;--surface-2:#f2f2f4;--line:#e6e6ea;--line-strong:#d4d4da;
  --fg:#18181b;--muted:#5f5f6b;--subtle:#8a8a96;
  --accent:#5b6cf0;--accent-fg:#fff;--accent-soft:rgba(91,108,240,.1);
  --ok:#14915a;--ok-soft:rgba(20,145,90,.1);--warn:#b26b00;--warn-soft:rgba(214,138,0,.12);
  --danger:#d14343;--danger-soft:rgba(209,67,67,.1);
  --radius:14px;--shadow:0 1px 2px rgba(16,16,24,.04),0 4px 16px rgba(16,16,24,.04);
}
@media (prefers-color-scheme: dark){:root{
  --bg:#0f0f11;--surface:#17171a;--surface-2:#1e1e22;--line:#26262b;--line-strong:#34343b;
  --fg:#ededf0;--muted:#a1a1ab;--subtle:#71717c;
  --accent:#7c8cff;--accent-fg:#0f0f11;--accent-soft:rgba(124,140,255,.14);
  --ok:#3ecf8e;--ok-soft:rgba(62,207,142,.12);--warn:#f5b041;--warn-soft:rgba(245,176,65,.13);
  --danger:#f87171;--danger-soft:rgba(248,113,113,.12);
  --shadow:none;
}}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.55 -apple-system,BlinkMacSystemFont,"Inter","Segoe UI",Roboto,"Helvetica Neue",sans-serif;-webkit-font-smoothing:antialiased}
main{max-width:920px;margin:0 auto;padding:40px 20px 72px}
a{color:var(--accent);text-decoration:none}a:hover{text-decoration:underline}
code{font:12.5px ui-monospace,SFMono-Regular,Menlo,monospace;background:var(--surface-2);border:1px solid var(--line);border-radius:6px;padding:1px 5px}
pre{margin:8px 0 0;white-space:pre-wrap;word-break:break-word;background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:12px 14px;font:12.5px/1.5 ui-monospace,SFMono-Regular,Menlo,monospace;max-height:420px;overflow:auto}

/* Page head */
.head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:28px}
.eyebrow{font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--subtle);margin:0 0 6px}
h1{font-size:28px;line-height:1.2;letter-spacing:-.02em;font-weight:650;margin:0}
.sub{color:var(--muted);margin:8px 0 0;max-width:640px}
.stats{display:flex;gap:8px;flex-wrap:wrap}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:8px 14px;min-width:92px;box-shadow:var(--shadow)}
.stat b{display:block;font-size:20px;line-height:1.2;font-weight:650;font-variant-numeric:tabular-nums}
.stat span{font-size:12px;color:var(--muted)}

/* Sections */
section{margin-top:32px}
.sec{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:0 0 12px}
h2{font-size:13px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);margin:0;display:flex;align-items:center;gap:8px}
h2 .n{font-size:12px;letter-spacing:0;background:var(--surface-2);border:1px solid var(--line);color:var(--muted);border-radius:99px;padding:0 8px;line-height:20px}
.list{display:grid;gap:10px}

/* Cards */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow)}
.card.pad{padding:18px 20px}
.item{padding:18px 20px;scroll-margin-top:20px;transition:border-color .2s}
.item.hl{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.item-top{display:flex;gap:14px;align-items:flex-start}
.item-main{flex:1;min-width:0}
.item-title{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.item-title strong{font-size:15.5px;font-weight:600}
.item-desc{color:var(--muted);margin-top:2px}
.item-actions{display:flex;gap:8px;align-items:center;flex-shrink:0;flex-wrap:wrap;justify-content:flex-end}
.item-foot{margin-top:16px;padding-top:14px;border-top:1px solid var(--line);display:flex;gap:10px 22px;flex-wrap:wrap;align-items:center}
.field{display:flex;align-items:center;gap:10px;color:var(--muted);font-size:13px}
.meta{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.chip{display:inline-flex;align-items:center;gap:5px;font-size:12px;line-height:20px;padding:0 8px;border-radius:6px;background:var(--surface-2);border:1px solid var(--line);color:var(--muted);max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chip.mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:11.5px}
.muted{color:var(--muted);font-size:13px}.subtle{color:var(--subtle);font-size:12.5px}

/* Monogram */
.mono-av{width:40px;height:40px;border-radius:11px;display:grid;place-items:center;flex-shrink:0;font-weight:650;font-size:15px;color:#fff;background:var(--accent);letter-spacing:-.02em;user-select:none}
.mono-av.sm{width:32px;height:32px;border-radius:9px;font-size:13px}

/* Status */
.status{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:550;line-height:22px;padding:0 9px 0 8px;border-radius:99px;background:var(--surface-2);color:var(--muted);white-space:nowrap}
.status::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor;opacity:.8}
.status.ok{background:var(--ok-soft);color:var(--ok)}
.status.warn{background:var(--warn-soft);color:var(--warn)}
.status.warn::before{animation:pulse 1.6s ease-in-out infinite}
.status.bad{background:var(--danger-soft);color:var(--danger)}
.status.accent{background:var(--accent-soft);color:var(--accent)}
@keyframes pulse{50%{opacity:.25}}

/* Callouts */
.callout{display:flex;gap:12px;align-items:flex-start;margin-top:14px;padding:12px 14px;border-radius:11px;background:var(--surface-2);border:1px solid var(--line)}
.callout.warn{background:var(--warn-soft);border-color:transparent}
.callout.ok{background:var(--ok-soft);border-color:transparent}
.callout.bad{background:var(--danger-soft);border-color:transparent}
.callout .grow{flex:1;min-width:0}
.callout-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}

/* Flash */
.flash{display:flex;align-items:center;gap:10px;margin:0 0 20px;padding:11px 14px;border-radius:12px;background:var(--ok-soft);color:var(--fg);border:1px solid transparent;animation:in .25s ease-out}
.flash::before{content:"✓";font-weight:700;color:var(--ok)}
.flash.err{background:var(--danger-soft)}.flash.err::before{content:"!";color:var(--danger)}
.flash span{flex:1}
.flash button{background:none;border:0;color:var(--muted);padding:2px 6px;font-size:18px;line-height:1}
@keyframes in{from{opacity:0;transform:translateY(-4px)}}

/* Buttons */
form{display:inline;margin:0}
form.block{display:block}
button,.btn{font:inherit;font-size:13px;font-weight:550;line-height:20px;display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line-strong);background:var(--surface);color:var(--fg);border-radius:9px;padding:6px 13px;cursor:pointer;text-decoration:none;white-space:nowrap;transition:background .15s,border-color .15s,opacity .15s}
button:hover,.btn:hover{background:var(--surface-2);text-decoration:none}
button:focus-visible,.btn:focus-visible,select:focus-visible,input:focus-visible,textarea:focus-visible,summary:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
button.primary,.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
button.primary:hover,.btn.primary:hover{opacity:.9;background:var(--accent)}
button.ghost{background:transparent;border-color:transparent;color:var(--muted)}
button.ghost:hover{background:var(--surface-2);color:var(--fg)}
button.danger{color:var(--danger)}
button.ghost.danger:hover{background:var(--danger-soft);color:var(--danger)}
button.sm,.btn.sm{padding:3px 10px;font-size:12.5px;border-radius:8px}
button[disabled]{opacity:.6;cursor:progress}

/* Segmented and switch */
.seg{display:inline-flex;padding:2px;border-radius:10px;background:var(--surface-2);border:1px solid var(--line)}
.seg button{border:0;background:transparent;color:var(--muted);padding:4px 11px;border-radius:8px;font-size:12.5px}
.seg button[aria-pressed=true]{background:var(--surface);color:var(--fg);box-shadow:0 1px 2px rgba(0,0,0,.12);cursor:default}
.switch{all:unset;cursor:pointer;display:inline-flex;align-items:center;gap:10px;color:var(--muted);font-size:13px}
.switch .track{width:32px;height:18px;border-radius:99px;background:var(--line-strong);position:relative;transition:background .15s;flex-shrink:0}
.switch .track::after{content:"";position:absolute;top:2px;left:2px;width:14px;height:14px;border-radius:50%;background:#fff;transition:transform .15s;box-shadow:0 1px 2px rgba(0,0,0,.2)}
.switch[aria-checked=true] .track{background:var(--ok)}
.switch[aria-checked=true] .track::after{transform:translateX(14px)}
.switch:focus-visible .track{outline:2px solid var(--accent);outline-offset:2px}

/* Inputs */
label{display:block;margin:12px 0 6px;font-size:12.5px;font-weight:550;color:var(--muted)}
label.inline{display:inline-flex;align-items:center;gap:8px;margin:0;font-weight:500;color:var(--fg);font-size:13px}
input[type=text],input[type=password],input:not([type]),textarea,select{font:inherit;font-size:13.5px;width:100%;border:1px solid var(--line-strong);background:var(--bg);color:var(--fg);border-radius:9px;padding:8px 11px;transition:border-color .15s,box-shadow .15s}
input:focus,textarea:focus,select:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft);outline:none}
select{width:auto;max-width:280px;padding:5px 30px 5px 10px;-webkit-appearance:none;appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);background-position:calc(100% - 15px) 52%,calc(100% - 10px) 52%;background-size:5px 5px;background-repeat:no-repeat;cursor:pointer}
textarea{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12.5px;min-height:240px;resize:vertical}
textarea.prose{font-family:inherit;font-size:13.5px;min-height:96px}
input[type=checkbox]{accent-color:var(--accent);width:15px;height:15px;margin:0}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:0 16px}
.form-grid .wide{grid-column:1/-1}
.form-actions{display:flex;gap:8px;margin-top:16px;align-items:center}
.reveal{margin-top:16px;padding-top:14px;border-top:1px solid var(--line)}
.search{position:relative;max-width:260px;width:100%}
.search input{padding-left:32px}
.search::before{content:"";position:absolute;left:12px;top:50%;width:10px;height:10px;border:1.6px solid var(--subtle);border-radius:50%;transform:translateY(-62%)}
.search::after{content:"";position:absolute;left:21px;top:58%;width:5px;height:1.6px;background:var(--subtle);transform:rotate(45deg)}

/* Disclosure */
details>summary{list-style:none;cursor:pointer}
details>summary::-webkit-details-marker{display:none}
.more>summary{display:inline-flex;align-items:center;gap:6px;color:var(--muted);font-size:13px;font-weight:550;padding:4px 0}
.more>summary::before{content:"";width:6px;height:6px;border-right:1.6px solid currentColor;border-bottom:1.6px solid currentColor;transform:rotate(-45deg);transition:transform .15s;margin-right:2px}
.more[open]>summary::before{transform:rotate(45deg)}
.more>summary:hover{color:var(--fg)}
.more[open]>.more-body{margin-top:10px}

/* Tables */
.table-wrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:13px}
th{font-size:11.5px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:var(--subtle);text-align:left;padding:10px 14px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:10px 14px;border-bottom:1px solid var(--line);vertical-align:middle}
tr:last-child td{border-bottom:0}
td.num{font-variant-numeric:tabular-nums;color:var(--muted);white-space:nowrap}
.method{display:inline-block;min-width:46px;font:600 11px/18px ui-monospace,SFMono-Regular,Menlo,monospace;text-align:center;border-radius:5px;background:var(--surface-2);color:var(--muted);margin-right:8px}
.method.POST,.method.PUT,.method.PATCH{background:var(--accent-soft);color:var(--accent)}
.method.DELETE{background:var(--danger-soft);color:var(--danger)}
.path{font:12.5px ui-monospace,SFMono-Regular,Menlo,monospace;word-break:break-all}
.out{font-size:12px;font-weight:550}
.out-read,.out-ok,.out-allowed,.out-changed{color:var(--ok)}
.out-held{color:var(--warn)}
.out-refused,.out-failed,.out-denied{color:var(--danger)}

/* AI panel */
.ai{margin-top:14px;padding:14px 16px;border-radius:12px;background:linear-gradient(180deg,var(--accent-soft),transparent 140%);border:1px solid var(--line)}
.ai-head{display:flex;align-items:center;gap:8px;font-size:12.5px;font-weight:600;color:var(--accent);margin-bottom:6px}
.ai-head::before{content:"✦"}
.ai ul{margin:4px 0 8px;padding-left:18px}.ai li{margin:3px 0}
.ai-cols{display:grid;grid-template-columns:1fr 1fr;gap:4px 20px;margin-top:8px}
.sev{display:inline-block;font-size:11px;font-weight:650;text-transform:uppercase;letter-spacing:.04em;border-radius:5px;padding:0 6px;margin-right:6px}
.sev-high{background:var(--danger-soft);color:var(--danger)}
.sev-medium{background:var(--warn-soft);color:var(--warn)}
.sev-low{background:var(--surface-2);color:var(--muted)}
.rule{display:flex;gap:12px;align-items:flex-start;justify-content:space-between;padding:10px 0;border-top:1px solid var(--line)}

.spin{display:inline-block;width:14px;height:14px;border:2px solid var(--line-strong);border-top-color:var(--accent);border-radius:50%;animation:spin .8s linear infinite;flex-shrink:0;margin-top:2px}
.callout.warn .spin{border-top-color:var(--warn)}
@keyframes spin{to{transform:rotate(360deg)}}
.empty{text-align:center;padding:40px 20px;color:var(--muted)}
.empty strong{display:block;color:var(--fg);font-size:15px;margin-bottom:4px}
[hidden]{display:none!important}
@media (max-width:640px){
  main{padding:24px 14px 56px}h1{font-size:24px}
  .item-top{flex-wrap:wrap}.item-actions{width:100%;justify-content:flex-start}.item-top:has(.mono-av) .item-actions{padding-left:54px}
  .form-grid,.ai-cols{grid-template-columns:1fr}
}
</style>
</head>
<body><main>
{{if .Msg}}<div class="flash{{if .Err}} err{{end}}" role="status"><span>{{.Msg}}</span><button type="button" aria-label="Dismiss" data-dismiss>×</button></div>{{end}}
{{template "body" .}}
</main>
<script>
// A form being sent says so at once: its button is held and tells what it
// waits for (data-busy), so a slow answer is never taken for a missed click.
// Something the page waits for (a consent, a check, a try) is followed in
// the background by a hidden frame of this page (?live=): it reloads itself
// every 5 seconds and posts a message when what the page waits for
// changed; the page then reloads, never while the person is typing or
// selecting. A sandboxed page cannot fetch itself (its origin is opaque);
// a message between frames needs none. Stops after 15 minutes.
(function () {
  var live = document.querySelector('meta[name="live"]');
  if (!live) return;
  var frame = document.createElement("iframe");
  frame.hidden = true;
  frame.src = location.pathname + "?live=" + encodeURIComponent(live.content);
  document.body.appendChild(frame);
  setTimeout(function () { frame.remove(); }, 15 * 60 * 1000);
  var busy = function () {
    var a = document.activeElement;
    return (a && /^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName)) || String(window.getSelection()) !== "";
  };
  var reloadWhenIdle = function () {
    if (busy()) { setTimeout(reloadWhenIdle, 2000); return; }
    location.reload();
  };
  window.addEventListener("message", function (e) {
    if (e.source === frame.contentWindow && e.data === "bnbloc-live-changed") { frame.remove(); reloadWhenIdle(); }
  });
})();
// consentHere reports whether a provider's consent page works on this
// page: its browser (data-open-in, a user agent pattern) and a name the host
// injects (data-open-with, any one of them); no rule: anywhere.
function consentHere(el) {
  var ua = el.getAttribute("data-open-in") || "";
  var names = (el.getAttribute("data-open-with") || "").split(" ").filter(Boolean);
  if (ua && !new RegExp(ua).test(navigator.userAgent)) return false;
  return !names.length || names.some(function (n) { return n in window; });
}
// A consent link that cannot work on this page is not offered.
document.querySelectorAll("[data-open-link]").forEach(function (a) { if (!consentHere(a)) a.hidden = true; });
document.addEventListener("submit", function (e) {
  // data-confirm: a step that is hard to undo asks first.
  var ask = e.target.getAttribute("data-confirm");
  if (ask && !window.confirm(ask)) { e.preventDefault(); return; }
  // A provider's consent page that works only where it is hosted a certain
  // way (consentHere): Connect opens it in place there, and anywhere else
  // asks the provider for its own prompt (notify) instead.
  if (e.target.notify && !consentHere(e.target)) e.target.notify.value = "1";
  var b = e.submitter || e.target.querySelector("button");
  if (!b) return;
  if (b.name) { var h = document.createElement("input"); h.type = "hidden"; h.name = b.name; h.value = b.value; e.target.appendChild(h); }
  setTimeout(function () { b.disabled = true; if (!b.classList.contains("switch")) b.textContent = b.getAttribute("data-busy") || "Working…"; }, 0);
});
// A choice applies as soon as it is made (data-autosubmit).
document.querySelectorAll("select[data-autosubmit]").forEach(function (s) {
  s.addEventListener("change", function () { s.form.requestSubmit ? s.form.requestSubmit() : s.form.submit(); });
});
// data-reveal: a button that shows the part it names (a form to fill in).
document.querySelectorAll("[data-reveal]").forEach(function (b) {
  b.addEventListener("click", function () {
    var t = document.getElementById(b.getAttribute("data-reveal"));
    if (!t) return;
    t.hidden = !t.hidden;
    b.setAttribute("aria-expanded", String(!t.hidden));
    var f = !t.hidden && t.querySelector("input:not([type=hidden]),textarea");
    if (f) f.focus();
  });
});
// A monogram for each system and worker: its initials on a color of its own.
document.querySelectorAll("[data-mono]").forEach(function (el) {
  var name = el.getAttribute("data-mono") || "?";
  var words = name.replace(/[^\p{L}\p{N} ]/gu, " ").trim().split(/\s+/);
  el.textContent = (words.length > 1 ? words[0][0] + words[1][0] : name.slice(0, 2)).toUpperCase();
  var h = 0;
  for (var i = 0; i < name.length; i++) h = (h * 31 + name.charCodeAt(i)) % 360;
  el.style.background = "linear-gradient(135deg,hsl(" + h + " 62% 56%),hsl(" + ((h + 40) % 360) + " 62% 46%))";
});
// data-filter: a search box that narrows the cards (data-search) below it.
document.querySelectorAll("[data-filter]").forEach(function (input) {
  input.addEventListener("input", function () {
    var q = input.value.trim().toLowerCase();
    document.querySelectorAll("[data-search]").forEach(function (el) {
      el.hidden = q !== "" && el.getAttribute("data-search").toLowerCase().indexOf(q) < 0;
    });
    document.querySelectorAll("[data-group]").forEach(function (g) {
      g.hidden = !g.querySelector("[data-search]:not([hidden])");
    });
  });
});
document.querySelectorAll("[data-dismiss]").forEach(function (b) {
  b.addEventListener("click", function () { b.parentElement.remove(); });
});
var hl = document.querySelector(".item.hl");
if (hl) hl.scrollIntoView({ block: "center" });
</script>
</body></html>{{end}}
