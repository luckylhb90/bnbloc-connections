{{define "layout"}}<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{.Title}}</title>
<style>
:root{--bg:#fff;--fg:#1d1d1f;--muted:#6e6e73;--line:#e5e5ea;--card:#f7f7f8;--accent:#3a5bd9;--danger:#c0392b;--ok:#1e8e3e}
@media (prefers-color-scheme: dark){:root{--bg:#141416;--fg:#ececf0;--muted:#9a9aa3;--line:#2c2c31;--card:#1c1c20;--accent:#7d97ff;--danger:#ff6b5e;--ok:#4cc36f}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
main{max-width:760px;margin:0 auto;padding:24px 16px 48px}h1{font-size:22px;margin:0 0 4px}h2{font-size:16px;margin:28px 0 8px}
.sub{color:var(--muted);margin:0 0 20px}.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px 16px;margin:10px 0}
.row{display:flex;gap:12px;align-items:flex-start;justify-content:space-between;flex-wrap:wrap}.muted{color:var(--muted);font-size:13px}
.pill{display:inline-block;font-size:12px;padding:1px 8px;border-radius:99px;border:1px solid var(--line);color:var(--muted)}.pill.ok{color:var(--ok);border-color:var(--ok)}
.hl{outline:2px solid var(--accent)}form{display:inline}form.block{display:block;margin-top:10px}
button{font:inherit;border:1px solid var(--line);background:var(--bg);color:var(--fg);border-radius:8px;padding:5px 12px;cursor:pointer}
button.primary{background:var(--accent);border-color:var(--accent);color:#fff}button.danger{color:var(--danger)}
input[type=text],input[type=password],textarea{font:inherit;width:100%;border:1px solid var(--line);background:var(--bg);color:var(--fg);border-radius:8px;padding:6px 10px}
textarea{font-family:ui-monospace,Menlo,monospace;font-size:13px;min-height:220px}pre{white-space:pre-wrap;word-break:break-word;background:var(--card);border:1px solid var(--line);border-radius:8px;padding:10px;font-size:13px}
.msg{border-left:3px solid var(--accent);padding:6px 12px;background:var(--card);margin:0 0 16px}.err{border-left-color:var(--danger)}
label{display:block;margin:6px 0 2px;font-size:13px;color:var(--muted)}table{border-collapse:collapse;width:100%;font-size:13px}td,th{border-bottom:1px solid var(--line);padding:4px 6px;text-align:left}
</style>
</head>
<body><main>
{{if .Msg}}<p class="msg{{if .Err}} err{{end}}" role="status">{{.Msg}}</p>{{end}}
{{template "body" .}}
</main></body></html>{{end}}
