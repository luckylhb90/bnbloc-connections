{{define "layout"}}<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{.Title}}</title>
{{if .Refresh}}<meta name="live" content="{{.State}}">{{end}}
<style>
:root{--bg:#fff;--fg:#1d1d1f;--muted:#6e6e73;--line:#e5e5ea;--card:#f7f7f8;--accent:#3a5bd9;--danger:#c0392b;--ok:#1e8e3e}
@media (prefers-color-scheme: dark){:root{--bg:#141416;--fg:#ececf0;--muted:#9a9aa3;--line:#2c2c31;--card:#1c1c20;--accent:#7d97ff;--danger:#ff6b5e;--ok:#4cc36f}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
main{max-width:760px;margin:0 auto;padding:24px 16px 48px}h1{font-size:22px;margin:0 0 4px}h2{font-size:16px;margin:28px 0 8px}
.sub{color:var(--muted);margin:0 0 20px}.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px 16px;margin:10px 0}
.row{display:flex;gap:12px;align-items:flex-start;justify-content:space-between;flex-wrap:wrap}.muted{color:var(--muted);font-size:13px}
.pill{display:inline-block;font-size:12px;padding:1px 8px;border-radius:99px;border:1px solid var(--line);color:var(--muted)}.pill.ok{color:var(--ok);border-color:var(--ok)}
.hl{outline:2px solid var(--accent)}form{display:inline}form.block{display:block;margin-top:10px}
button{font:inherit;border:1px solid var(--line);background:var(--bg);color:var(--fg);border-radius:8px;padding:5px 12px;cursor:pointer}
button.primary{background:var(--accent);border-color:var(--accent);color:#fff}button.danger{color:var(--danger)}
input[type=text],input[type=password],textarea{font:inherit;width:100%;border:1px solid var(--line);background:var(--bg);color:var(--fg);border-radius:8px;padding:6px 10px}
textarea{font-family:ui-monospace,Menlo,monospace;font-size:13px;min-height:220px}pre{white-space:pre-wrap;word-break:break-word;background:var(--card);border:1px solid var(--line);border-radius:8px;padding:10px;font-size:13px}
.msg{border-left:3px solid var(--accent);padding:6px 12px;background:var(--card);margin:0 0 16px}.err{border-left-color:var(--danger)}
.ai{border-left:3px solid var(--accent);padding:6px 12px;margin:10px 0 0;background:var(--bg);border-radius:0 8px 8px 0}.ai ul{margin:4px 0;padding-left:20px}.sev-high{color:var(--danger);font-weight:600}.sev-medium{color:var(--fg);font-weight:600}.sev-low{color:var(--muted)}
.spin{display:inline-block;width:12px;height:12px;border:2px solid var(--line);border-top-color:var(--accent);border-radius:50%;animation:spin .8s linear infinite;vertical-align:-1px}@keyframes spin{to{transform:rotate(360deg)}}
button[disabled]{opacity:.6;cursor:progress}
label{display:block;margin:6px 0 2px;font-size:13px;color:var(--muted)}table{border-collapse:collapse;width:100%;font-size:13px}td,th{border-bottom:1px solid var(--line);padding:4px 6px;text-align:left}
</style>
</head>
<body><main>
{{if .Msg}}<p class="msg{{if .Err}} err{{end}}" role="status">{{.Msg}}</p>{{end}}
{{template "body" .}}
</main>
<script>
// A form being sent says so at once: its button is held and tells what it
// waits for (data-busy), so a slow answer is never taken for a missed click.
// Something the page waits for (a consent, a check, a try) is followed in
// the background by a hidden frame of this page (?live=): it reloads itself
// every 5 seconds and posts a message when what the page waits for
// changed; the page then reloads, never while the person is typing or
// selecting. A sandboxed page cannot fetch itself (its origin is opaque);
// a message between frames needs none. Stops after 15 minutes.
(function () {
  var live = document.querySelector('meta[name="live"]');
  if (!live) return;
  var frame = document.createElement("iframe");
  frame.hidden = true;
  frame.src = location.pathname + "?live=" + encodeURIComponent(live.content);
  document.body.appendChild(frame);
  setTimeout(function () { frame.remove(); }, 15 * 60 * 1000);
  var busy = function () {
    var a = document.activeElement;
    return (a && /^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName)) || String(window.getSelection()) !== "";
  };
  var reloadWhenIdle = function () {
    if (busy()) { setTimeout(reloadWhenIdle, 2000); return; }
    location.reload();
  };
  window.addEventListener("message", function (e) {
    if (e.source === frame.contentWindow && e.data === "bnbloc-live-changed") { frame.remove(); reloadWhenIdle(); }
  });
})();
document.addEventListener("submit", function (e) {
  // A provider's consent page that works only in some browser (a chat
  // app's, data-open-in): Connect opens it in place there, and anywhere else
  // asks the provider for its own prompt (notify) instead.
  var openIn = e.target.getAttribute("data-open-in");
  if (openIn && !new RegExp(openIn).test(navigator.userAgent) && e.target.notify) e.target.notify.value = "1";
  var b = e.submitter || e.target.querySelector("button");
  if (!b) return;
  if (b.name) { var h = document.createElement("input"); h.type = "hidden"; h.name = b.name; h.value = b.value; e.target.appendChild(h); }
  setTimeout(function () { b.disabled = true; b.textContent = b.getAttribute("data-busy") || "Working…"; }, 0);
});
</script>
</body></html>{{end}}
